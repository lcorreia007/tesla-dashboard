<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Match 3 Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Luckiest+Guy&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh; flex-direction: column; gap: 16px;
        padding-bottom: 96px;
        background: radial-gradient(ellipse at 50% 15%, #9ede63 0%, #57b536 50%, #2c7a1e 100%);
        font-family: 'Luckiest Guy', 'Arial Black', Arial, sans-serif;
        color: #fff;
        -webkit-user-select: none; user-select: none;
    }
    body::after {
        content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 5;
        background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.4));
    }
    h1 {
        font-size: 48px; font-weight: normal; letter-spacing: 3px;
        transform: rotate(-2deg);
        text-shadow:
            2px 0 0 #5b3a12, -2px 0 0 #5b3a12, 0 2px 0 #5b3a12, 0 -2px 0 #5b3a12,
            2px 2px 0 #5b3a12, -2px -2px 0 #5b3a12, 2px -2px 0 #5b3a12, -2px 2px 0 #5b3a12,
            0 6px 0 rgba(0,0,0,.3);
    }
    .score-board { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .stat {
        display: flex; align-items: center; gap: 8px;
        background: rgba(46, 28, 11, .9);
        border: 3px solid #f7c948; border-radius: 999px;
        padding: 6px 18px 6px 12px; font-size: 20px; color: #ffd94d;
        box-shadow: inset 0 2px 5px rgba(0,0,0,.55), 0 3px 0 rgba(0,0,0,.25);
        text-shadow: 0 2px 0 rgba(0,0,0,.6);
    }
    .stat strong { min-width: 2ch; text-align: right; color: #fff; }
    .controls {
        position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 6;
        width: calc(100% - 24px); max-width: 960px;
        display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 12px;
        padding: 0;
        transform: translateX(-50%);
    }
    .controls button {
        font-family: inherit; font-size: 15px; letter-spacing: 1px;
        color: #fff; text-transform: uppercase; cursor: pointer;
        background: linear-gradient(#ffe27a 0%, #f7b500 55%, #e69300 100%);
        border: 3px solid #7a4b12; border-radius: 14px; padding: 8px 16px;
        text-shadow:
            1.5px 0 0 #5b3a12, -1.5px 0 0 #5b3a12, 0 1.5px 0 #5b3a12, 0 -1.5px 0 #5b3a12,
            1px 1px 0 #5b3a12, -1px -1px 0 #5b3a12, 1px -1px 0 #5b3a12, -1px 1px 0 #5b3a12;
        box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 4px 0 #7a4b12, 0 7px 10px rgba(0,0,0,.35);
        transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
    }
    .controls button:hover { filter: brightness(1.07); }
    .controls button:active {
        transform: translateY(3px);
        box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 1px 0 #7a4b12, 0 3px 5px rgba(0,0,0,.35);
    }
    .controls button.active {
        background: linear-gradient(#b5ec7a 0%, #5cb531 55%, #3f9420 100%);
        border-color: #2c6415;
        text-shadow:
            1.5px 0 0 #1e4a0d, -1.5px 0 0 #1e4a0d, 0 1.5px 0 #1e4a0d, 0 -1.5px 0 #1e4a0d,
            1px 1px 0 #1e4a0d, -1px -1px 0 #1e4a0d, 1px -1px 0 #1e4a0d, -1px 1px 0 #1e4a0d;
        box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 4px 0 #2c6415, 0 7px 10px rgba(0,0,0,.35);
    }
    .controls button.active:active {
        box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 1px 0 #2c6415, 0 3px 5px rgba(0,0,0,.35);
    }
    .scene {
        perspective: 1800px;
        perspective-origin: 50% 35%;
        width: 720px; height: 520px;
        display: flex; justify-content: center; align-items: center;
        transition: perspective .8s ease-in-out;
    }
    /* huge perspective ≈ orthographic = isometric camera */
    .scene.ortho { perspective: 40000px; }
    .board {
        position: relative;
        width: 480px; height: 480px;
       --spin-angle: 0deg;
       transform: rotateX(54deg) rotateZ(calc(-45deg + var(--spin-angle))) scale3d(var(--board-scale, 1), var(--board-scale, 1), var(--board-scale, 1));
       transform-style: preserve-3d;
       transition: transform .8s ease-in-out;
    }
    /* visible base sits 16px below the tile plane so waving tiles
       (down to translateZ(-14px)) never clip into it */
    .board::before {
        content: ''; position: absolute; inset: 0;
        background: #4a3418; border-radius: 14px;
        box-shadow: 0 0 60px rgba(0,0,0,.45), 0 24px 40px rgba(0,0,0,.35), inset 0 0 0 4px rgba(0,0,0,.2);
        transform: translateZ(-16px);
    }
    .board.view-top   { transform: rotateX(0deg) rotateZ(var(--spin-angle)) scale3d(var(--board-scale, 1), var(--board-scale, 1), var(--board-scale, 1)); }
    .board.view-front { transform: rotateX(45deg) rotateZ(var(--spin-angle)) scale3d(var(--board-scale, 1), var(--board-scale, 1), var(--board-scale, 1)); }
    /* spinning the scene container rotates the whole 3D board in screen
       space without disturbing its internal tilt, so it works in any view */
    @property --spin-angle {
        syntax: '<angle>';
        inherits: false;
        initial-value: 0deg;
    }
    .board { --spin-start: 0deg; }
    .board.spinning {
        transform-origin: center center;
        animation: board-spin 6s linear infinite;
    }
    @keyframes board-spin {
        from { --spin-angle: var(--spin-start); }
        to   { --spin-angle: calc(var(--spin-start) + 360deg); }
    }
    .tile {
        position: absolute; width: 56px; height: 56px;
        transform-style: preserve-3d;
        transition: top .25s ease-in-out, left .25s ease-in-out;
    }
    .tile:hover .cube  { transform: translateZ(42px); }
    .tile.selected .cube { transform: translateZ(52px); }
    /* selected tiles are slightly brightened on every face; the filter is
       3D-safe on leaf faces but would flatten preserve-3d on .cube/.tile */
    .tile.selected .face { filter: brightness(1.3); }
    .tile.hint .cube { animation: hint-pulse 1s ease-in-out infinite; }
    /* white glow on every face (top-only styling is invisible in iso view).
       Ring, aura plate and shadow all live on the leaf faces / ::before,
       which is 3D-safe; a filter on .cube would flatten preserve-3d. */
    .tile.hint .face {
        box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), 0 0 10px 2px rgba(255,255,255,.55);
        animation: hint-glow 1s ease-in-out infinite;
    }
    .tile.hint .face::before {
        content: ''; position: absolute; inset: -6px; z-index: -1;
        border-radius: 10px;
        background: radial-gradient(closest-side, rgba(255,255,255,.5), rgba(255,255,255,0));
    }
    @keyframes hint-glow {
        0%, 100% { box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), 0 0 10px 2px rgba(255,255,255,.55); }
        50%      { box-shadow: inset 0 0 0 3px #fff, 0 0 16px 4px rgba(255,255,255,.75); }
    }
    @keyframes hint-pulse {
        0%, 100% { transform: translateZ(28px); }
        50%      { transform: translateZ(48px); }
    }
    /* special tiles: line bombs get a stripe overlay on every face
       (pointer-events: none so clicks still hit the face itself);
       color bomb faces are styled inline by styleColor() */
    .tile.special-row .face::after,
    .tile.special-col .face::after {
        content: ''; position: absolute; inset: 0; border-radius: 5px;
        pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 5px, transparent 5px 14px);
    }
    .tile.special-col .face::after {
        background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 5px, transparent 5px 14px);
    }
    .cube {
        position: relative; width: 56px; height: 56px;
        transform: translateZ(28px);
        transform-style: preserve-3d;
        transition: transform .2s ease;
        cursor: pointer;
    }
    .face {
        position: absolute; width: 56px; height: 56px;
        display: flex; justify-content: center; align-items: center;
        font-size: 28px; border-radius: 5px;
        backface-visibility: hidden;
    }
    .face.top    { transform: rotateX(90deg)  translateZ(28px); }
    .face.bottom { transform: rotateX(-90deg) translateZ(28px); }
    .face.front  { transform: translateZ(28px); }
    .face.back   { transform: rotateY(180deg) translateZ(28px); }
    .face.left   { transform: rotateY(-90deg) translateZ(28px); }
    .face.right  { transform: rotateY(90deg)  translateZ(28px); }
    .tile.match-anim {
        animation: rise .65s ease-out forwards; pointer-events: none;
    }
    .tile.match-anim .face {
        animation: face-fade .65s ease-out forwards;
    }
    @keyframes rise {
        0%   { transform: translateZ(0) scale(1); }
        30%  { transform: translateZ(30px) scale(1.08); }
        100% { transform: translateZ(112px) scale(.9); }
    }
    @keyframes face-fade {
        0%, 30% { opacity: 1; }
        100%    { opacity: 0; }
    }
    .points-popup {
        position: fixed; z-index: 10; pointer-events: none;
        color: #ffe14d; font-size: 30px;
        text-shadow:
            2px 0 0 #6b3d0f, -2px 0 0 #6b3d0f, 0 2px 0 #6b3d0f, 0 -2px 0 #6b3d0f,
            1.5px 1.5px 0 #6b3d0f, -1.5px -1.5px 0 #6b3d0f, 1.5px -1.5px 0 #6b3d0f, -1.5px 1.5px 0 #6b3d0f,
            0 0 14px rgba(255,200,0,.65), 0 4px 3px rgba(0,0,0,.4);
        transform: translate(-50%, -50%);
        animation: points-rise 1.6s ease-out forwards;
    }
    /* --pop-scale grows with the cascade level (set by showPoints) */
    @keyframes points-rise {
        0%   { opacity: 0; transform: translate(-50%, -30%) scale(calc(.6 * var(--pop-scale, 1))); }
        25%  { opacity: 1; transform: translate(-50%, -60%) scale(calc(1.2 * var(--pop-scale, 1))); }
        100% { opacity: 0; transform: translate(-50%, -150%) scale(var(--pop-scale, 1)); }
    }
    .points-popup.combo { filter: drop-shadow(0 0 calc(4px * var(--pop-scale, 1)) rgba(255,236,140,.9)); }
    .particle {
        position: fixed; z-index: 9; width: var(--size); height: var(--size);
        border-radius: 50%; pointer-events: none; background: var(--color);
        box-shadow: 0 0 8px var(--color);
        animation: particle-burst 1.4s cubic-bezier(.1,.65,.25,1) forwards;
      }
@keyframes particle-burst {
         0%    { opacity: 1; transform: translate(-50%, -50%) scale(1); }
         70%   { opacity: .9; }
         100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.15); }
        }

    /* ── special-tile effects ── */
    /* idle shimmer: line-bomb stripes scroll, color bombs get a rainbow ring */
    .tile.special-row .face::after { animation: stripe-scroll-row 1.4s linear infinite; }
    .tile.special-col .face::after { animation: stripe-scroll-col 1.4s linear infinite; }
    @keyframes stripe-scroll-row { to { background-position: 0 14px; } }
    @keyframes stripe-scroll-col { to { background-position: 14px 0; } }
    .tile.special-color .face::after {
        content: ''; position: absolute; inset: 2px; border-radius: 50%;
        pointer-events: none;
        background: conic-gradient(#ff4d4d, #ffd84d, #4dff88, #4dd2ff, #9b6bff, #ff4dd8, #ff4d4d);
        -webkit-mask: radial-gradient(closest-side, transparent 76%, #000 80%);
                mask: radial-gradient(closest-side, transparent 76%, #000 80%);
        animation: bomb-shimmer 2.4s linear infinite;
    }
    @keyframes bomb-shimmer { to { filter: hue-rotate(360deg); } }

    /* line-bomb beam: a fixed overlay sweeping from the bomb to the board edge */
    .beam {
        position: fixed; z-index: 9; height: 12px; margin-top: -6px; pointer-events: none;
        transform-origin: 0 50%; border-radius: 6px;
        background: linear-gradient(90deg, #fff 0%, #fff 85%, rgba(255,255,255,0));
        box-shadow: 0 0 16px 5px var(--color), 0 0 3px 1px #fff;
        transform: rotate(var(--angle)) scaleX(0);
        animation: beam-sweep .5s linear forwards;
    }
    /* 56% of .5s = 280ms = 7 cells at the 40ms/cell blast stagger */
    @keyframes beam-sweep {
        0%   { opacity: 1; transform: rotate(var(--angle)) scaleX(0); }
        56%  { opacity: 1; transform: rotate(var(--angle)) scaleX(1); }
        100% { opacity: 0; transform: rotate(var(--angle)) scaleX(1) scaleY(.3); }
    }

    /* color-bomb lightning: one polyline per target, drawn via dashoffset */
    .lightning {
        position: fixed; inset: 0; width: 100%; height: 100%; z-index: 9;
        pointer-events: none; overflow: visible;
        filter: drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 9px var(--glow));
        animation: lightning-fade .8s ease-in forwards;
    }
    .lightning polyline {
        fill: none; stroke: #fff; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: lightning-draw .2s ease-out forwards;
    }
    @keyframes lightning-draw { to { stroke-dashoffset: 0; } }
    @keyframes lightning-fade { 0%, 65% { opacity: 1; } 100% { opacity: 0; } }
    /* :not(.match-anim) so these never override the face-fade removal */
    .tile.zapped:not(.match-anim) .face { animation: zap-flash .1s steps(2) var(--zap-delay, 0ms) 4; }
    @keyframes zap-flash {
        0%   { filter: brightness(2.6) saturate(.4); }
        100% { filter: brightness(1); }
    }

    /* ── gravity and swap feel ── */
    /* falling tiles accelerate (ease-in), staggered per column via --fall-delay */
    .tile.falling {
        transition: top .3s cubic-bezier(.55,0,1,.45) var(--fall-delay, 0ms), left .25s ease-in-out;
    }
    /* first half of the animation covers the fall, second half the squash */
    .tile.landing .cube { animation: land .6s ease-out var(--fall-delay, 0ms) backwards; }
    .tile.landing.spawned .cube { animation-name: spawn-land; }
    @keyframes land {
        0%, 50% { transform: translateZ(28px) scale3d(1, 1, 1); }
        62%     { transform: translateZ(20px) scale3d(1.12, 1.12, .72); }
        80%     { transform: translateZ(31px) scale3d(.96, .96, 1.1); }
        100%    { transform: translateZ(28px) scale3d(1, 1, 1); }
    }
    @keyframes spawn-land {
        0%   { transform: translateZ(110px) rotateZ(-140deg) scale3d(.7, .7, .7);
               animation-timing-function: cubic-bezier(.55,0,1,.45); }
        50%  { transform: translateZ(28px) rotateZ(0deg) scale3d(1, 1, 1); }
        62%  { transform: translateZ(20px) scale3d(1.12, 1.12, .72); }
        80%  { transform: translateZ(31px) scale3d(.96, .96, 1.1); }
        100% { transform: translateZ(28px) scale3d(1, 1, 1); }
    }
    /* rejected swap: tiles nudge into each other, then wobble back */
    .tile.bumping { transition: top .13s ease-in, left .13s ease-in; }
    .tile.wobble .cube { animation: wobble .42s ease-out; }
    @keyframes wobble {
        0%   { transform: translateZ(28px) rotateZ(0deg); }
        20%  { transform: translateZ(28px) rotateZ(14deg); }
        40%  { transform: translateZ(28px) rotateZ(-10deg); }
        60%  { transform: translateZ(28px) rotateZ(6deg); }
        80%  { transform: translateZ(28px) rotateZ(-3deg); }
        100% { transform: translateZ(28px) rotateZ(0deg); }
    }
    /* bomb creation pop (declared last so it wins over landing/wobble) */
    .tile.special-pop .cube { animation: special-pop .5s cubic-bezier(.3,1.5,.5,1); }
    .tile.special-pop:not(.match-anim) .face { animation: pop-flash .5s ease-out; }
    @keyframes special-pop {
        0%   { transform: translateZ(28px) scale3d(.6, .6, .6); }
        45%  { transform: translateZ(60px) scale3d(1.3, 1.3, 1.3); }
        100% { transform: translateZ(28px) scale3d(1, 1, 1); }
    }
    @keyframes pop-flash {
        0%   { filter: brightness(2.4); }
        100% { filter: brightness(1); }
    }

    /* ── combo escalation ── */
    body { --flash-color: rgba(255,226,122,.6); }
    /* z-index -1 paints above the page background but behind the board */
    .combo-flash {
        position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: radial-gradient(ellipse at 50% 55%, var(--flash-color), transparent 70%);
        opacity: 0; animation: combo-flash .55s ease-out forwards;
    }
    @keyframes combo-flash {
        0%   { opacity: var(--flash-strength, .5); }
        100% { opacity: 0; }
    }
    /* shake the .scene wrapper; the .board keeps its own 3D transform */
    .scene.shake { animation: board-shake .4s linear; }
    @keyframes board-shake {
        0%, 100% { transform: translate(0, 0); }
        15% { transform: translate(calc(var(--shake) * -1), calc(var(--shake) * .5)); }
        30% { transform: translate(var(--shake), calc(var(--shake) * -.5)); }
        45% { transform: translate(calc(var(--shake) * -.6), calc(var(--shake) * -.3)); }
        60% { transform: translate(calc(var(--shake) * .5), calc(var(--shake) * .4)); }
        75% { transform: translate(calc(var(--shake) * -.3), calc(var(--shake) * .2)); }
        90% { transform: translate(calc(var(--shake) * .15), calc(var(--shake) * -.1)); }
    }
    .combo-banner {
        position: fixed; left: 50%; top: 42%; z-index: 12; pointer-events: none;
        font-size: clamp(32px, 9vw, 64px); color: #ffe14d; white-space: nowrap;
        text-shadow:
            3px 0 0 #6b3d0f, -3px 0 0 #6b3d0f, 0 3px 0 #6b3d0f, 0 -3px 0 #6b3d0f,
            2px 2px 0 #6b3d0f, -2px -2px 0 #6b3d0f, 2px -2px 0 #6b3d0f, -2px 2px 0 #6b3d0f,
            0 0 24px rgba(255,200,0,.8), 0 8px 4px rgba(0,0,0,.4);
        transform: translate(-50%, -50%);
        animation: banner-pop 1.4s cubic-bezier(.2,1.4,.4,1) forwards;
    }
    @keyframes banner-pop {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); }
        20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1) rotate(-3deg); }
        75%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
        100% { opacity: 0; transform: translate(-50%, -75%) scale(1.05) rotate(-3deg); }
    }

       /* ── RETRO THEME (neon CRT arcade) ── */
     body.retro {
        background:
             repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px),
             radial-gradient(ellipse at 50% 30%, #1b1046 0%, #0a0620 60%, #04020e 100%);
        font-family: 'Press Start 2P', 'Luckiest Guy', monospace;
        color: #6cffb0;
     }
     body.retro::after {
        background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
        z-index: 20;
     }
     body.retro h1 {
        font-size: 32px; letter-spacing: 2px; transform: none;
        text-shadow:
             0 0 6px #00f, 0 0 14px #00f, 0 0 26px #0ff,
             3px 3px 0 #08243a;
        animation: neon-flicker 3.2s steps(1) infinite;
     }
     @keyframes neon-flicker {
         0%, 92%, 100% { opacity: 1; }
         93% { opacity: .55; }
         95% { opacity: 1; }
         97% { opacity: .7; }
     }
     body.retro .stat {
        background: #0c0824;
        border: 2px solid #0ff; border-radius: 4px;
        color: #ff3ea5; font-size: 12px;
        box-shadow: 0 0 10px #0ff, inset 0 0 8px rgba(0,255,255,.25);
        text-shadow: 0 0 6px #ff3ea5;
     }
     body.retro .stat strong { color: #6cffb0; text-shadow: 0 0 6px #6cffb0; }
     body.retro .controls { z-index: 7; }
     body.retro .controls button {
        font-family: 'Press Start 2P', monospace; font-size: 9px;
        color: #001; text-transform: uppercase;
        background: #00e5ff;
        border: 2px solid #0a3a44; border-radius: 4px; padding: 8px 10px;
        text-shadow: none;
        box-shadow: 0 0 10px #00e5ff, inset 0 0 6px rgba(255,255,255,.4);
     }
     body.retro .controls button.active {
        background: #ff3ea5;
        border-color: #44002a;
        box-shadow: 0 0 12px #ff3ea5, inset 0 0 6px rgba(255,255,255,.4);
     }
     body.retro .board::before {
        background: #0a0722;
        box-shadow: 0 0 40px rgba(0,255,255,.35), 0 0 0 2px rgba(0,255,255,.4);
        border-radius: 6px;
     }
     body.retro .face {
        image-rendering: pixelated;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 0 8px currentColor;
     }
      body.retro .points-popup {
        color: #6cffb0; font-size: 22px;
        text-shadow: 0 0 8px #6cffb0, 0 0 16px #0ff;
      }
      body.retro .particle { box-shadow: 0 0 10px var(--color); }
      body.retro { --flash-color: rgba(0,255,255,.45); }
      body.retro .combo-banner {
        font-size: clamp(18px, 5vw, 36px); color: #ff3ea5;
        text-shadow: 0 0 8px #ff3ea5, 0 0 20px #0ff, 4px 4px 0 #08243a;
      }

      /* keep the switch button above the CRT scanline overlay */
      .theme-wrap { position: fixed; top: 12px; right: 12px; z-index: 21; }
      .theme-btn {
        font-family: 'Press Start 2P', 'Luckiest Guy', monospace;
        font-size: 10px; letter-spacing: 1px; color: #0008; cursor: pointer;
        background: #f7c948;
        border: 2px solid #16110a; border-radius: 4px; padding: 8px 10px;
        text-transform: uppercase;
        box-shadow: 0 3px 0 #7a4b12;
        transition: transform .06s ease, box-shadow .06s ease, filter .15s ease;
      }
      .theme-btn:hover { filter: brightness(1.08); }
      .theme-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #7a4b12; }
      body.retro .theme-btn {

</style>

<body>
<div class="theme-wrap"><button id="theme-btn" class="theme-btn">Theme: Classic</button></div>
<h1>Match 3</h1>
<div class="score-board">
    <span class="stat">&#128176; <strong id="score">0</strong></span>
    <span class="stat">&#9889; <strong id="moves">0</strong></span>
</div>
<div class="controls">
    <button id="mode-btn">Mode: Manual</button>
    <button id="sound-btn" class="active">Sound: On</button>
    <button id="wave-btn">Wave: Off</button>
    <button id="cam-btn">Camera: Iso</button>
    <button id="proj-btn">Proj: Persp</button>
    <button id="spin-btn">Spin: Off</button>
    <button id="hint-btn">Hint</button>
</div>
<div class="scene"><div class="board" id="board"></div></div>

<script>
const ROWS = 8, COLS = 8, CELL = 60;
const COLORS = ['#e74c3c','#2ecc71','#3498db','#f1c40f','#9b59b6','#e67e22'];
const COLOR_BOMB = 6;   // grid value for a color bomb: never matches by color
const EMOJIS = ['\uD83D\uDD34','\uD83D\uDFE2','\uD83D\uDD35','\uD83D\uDFE1','\uD83D\uDFE3','\uD83D\uDFE0'];
// candy theme uses pastel candy colours and sweet emojis
const CANDY_COLORS = ['#ff8fb8','#8fe3c0','#8fc7ff','#ffd66b','#c79bff','#ffb08f'];
const CANDY_EMOJIS = ['\uD83C\uDF6F','\uD83C\uDF6C','\uD83C\uDF6E','\uD83C\uDF6A','\uD83C\uDF6D','\uD83C\uDF69'];
const STARWARS_COLORS = ['#e53935','#4fc3f7','#ffe81f','#66bb6a','#ab47bc','#ff8a3d'];
const STARWARS_EMOJIS = ['\u2694\uFE0F','\uD83D\uDEE1\uFE0F','\u2B50','\uD83D\uDFE2','\uD83D\uDD2E','\uD83D\uDD25'];

let grid = [];
let tiles = {};       // "r,c" -> { el, r, c, color }
let score = 0, moves = 0;
let animating = false;
let audioCtx = null;
let soundOn = true;

const board = document.getElementById('board');

// ── helpers ──────────────────────────────────────────────
function posTop(r)     { return r * CELL + 'px'; }
function posLeft(c)    { return c * CELL + 'px'; }
function key(r, c)     { return r + ',' + c; }
function wait(ms)      { return new Promise(res => setTimeout(res, ms)); }

function enableAudio() {
    if (!soundOn) return;
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(frequency, duration, type, volume, delay = 0) {
    if (!soundOn || !audioCtx || audioCtx.state !== 'running') return;
    const start = audioCtx.currentTime + delay;
    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain).connect(audioCtx.destination);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.02);
}

function playSwapSound() {
    playTone(260, 0.09, 'triangle', 0.06);
    playTone(390, 0.1, 'triangle', 0.05, 0.06);
}

function playInvalidSound() {
    playTone(180, 0.16, 'square', 0.035);
    playTone(130, 0.2, 'square', 0.025, 0.1);
}

function playMatchSound(matchCount) {
    const bonus = Math.min(matchCount - 3, 5) * 35;
    playTone(440 + bonus, 0.28, 'sine', 0.07);
    playTone(554 + bonus, 0.3, 'sine', 0.06, 0.08);
    playTone(659 + bonus, 0.36, 'triangle', 0.055, 0.16);
}

// create a tile dom element (3D cube with 6 faces)
function makeTileEl(initialColor) {
    const el = document.createElement('div');
    el.className = 'tile';
    const cube = document.createElement('div');
    cube.className = 'cube';
    for (const f of ['top','bottom','front','back','left','right']) {
        const face = document.createElement('div');
        face.className = 'face ' + f;
        cube.appendChild(face);
    }
    el.appendChild(cube);
    board.appendChild(el);
    return el;
}

// darken a hex colour by a factor (0–1) for shading cube sides
function darken(hex, factor) {
    const r = Math.floor(parseInt(hex.slice(1,3), 16) * factor);
    const g = Math.floor(parseInt(hex.slice(3,5), 16) * factor);
    const b = Math.floor(parseInt(hex.slice(5,7), 16) * factor);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
}

// active palette depends on the current theme
function activeColors() {
    if (document.body.classList.contains('candy')) return CANDY_COLORS;
    if (document.body.classList.contains('starwars')) return STARWARS_COLORS;
    return COLORS;
}
function activeEmojis() {
    if (document.body.classList.contains('candy')) return CANDY_EMOJIS;
    if (document.body.classList.contains('starwars')) return STARWARS_EMOJIS;
    return EMOJIS;
}

function styleColor(el, col, special = null) {
    const cube = el.querySelector('.cube');
    if (col >= 0) {
       cube.style.display = '';
       // The board lifts each cube along Z, making its front face the
       // upward-facing tile surface.
       const top = cube.querySelector('.front');
       cube.querySelector('.top').textContent = '';
       if (special === 'color') {
           top.style.background = '#33231a';
           top.textContent = '\uD83D\uDCA3'; // 💣
           cube.querySelector('.top').style.background     = '#2a1c15';
           cube.querySelector('.right').style.background   = '#33241b';
           cube.querySelector('.left').style.background    = '#1f140e';
           cube.querySelector('.back').style.background    = '#1a110b';
           cube.querySelector('.bottom').style.background = '#140d08';
        } else {
           const base = activeColors()[col];
           top.style.background = base;
           top.textContent = activeEmojis()[col];
           cube.querySelector('.top').style.background     = darken(base, 0.72);
           cube.querySelector('.right').style.background  = darken(base, 0.85);
           cube.querySelector('.left').style.background   = darken(base, 0.55);
           cube.querySelector('.back').style.background   = darken(base, 0.50);
           cube.querySelector('.bottom').style.background = darken(base, 0.40);
        }
    } else {
       cube.style.display = 'none';
    }
}

// move tile DOM element to grid coords (animated)
function setTilePos(el, r, c) {
    el.style.top = posTop(r);
    el.style.left = posLeft(c);
}

function showPoints(points, matchedKeys, cascade = 1) {
    const rects = [...matchedKeys].map(k => tiles[k].el.getBoundingClientRect());
    const centerX = rects.reduce((sum, rect) => sum + rect.left + rect.width / 2, 0) / rects.length;
    const centerY = rects.reduce((sum, rect) => sum + rect.top + rect.height / 2, 0) / rects.length;
    const popup = document.createElement('div');
    popup.className = 'points-popup';
    popup.textContent = '+' + points + (cascade > 1 ? ' Combo x' + cascade : '');
    popup.style.left = centerX + 'px';
    popup.style.top = centerY + 'px';
    popup.style.setProperty('--pop-scale', Math.min(1 + (cascade - 1) * 0.18, 1.9));
    popup.classList.toggle('combo', cascade > 1);
    document.body.appendChild(popup);
    popup.addEventListener('animationend', () => popup.remove());
}

// delays: optional Map key -> ms, so blast-staggered tiles burst as they pop
function burstParticles(matchedKeys, cascade = 1, delays = null) {
    const groups = new Map();
    for (const k of matchedKeys) {
        const d = delays ? delays.get(k) || 0 : 0;
        if (!groups.has(d)) groups.set(d, []);
        groups.get(d).push(k);
    }
    for (const [d, keys] of groups) {
        if (d > 0) setTimeout(() => spawnParticles(keys, cascade), d);
        else spawnParticles(keys, cascade);
    }
}

function spawnParticles(keys, cascade) {
    const count = Math.min(7 + (cascade - 1) * 3, 16);
    const reach = Math.min(1 + (cascade - 1) * 0.15, 1.6);
    const fragment = document.createDocumentFragment();
    for (const k of keys) {
        const tile = tiles[k];
        if (!tile) continue;
        const rect = tile.el.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const distance = (35 + Math.random() * 55) * reach;
            const particle = document.createElement('i');
            particle.className = 'particle';
            particle.style.left = centerX + 'px';
            particle.style.top = centerY + 'px';
            particle.style.setProperty('--x', Math.cos(angle) * distance + 'px');
            particle.style.setProperty('--y', Math.sin(angle) * distance + 'px');
            particle.style.setProperty('--size', 4 + Math.random() * 7 + 'px');
            particle.style.setProperty('--color', activeColors()[tile.color] || '#fff');
            particle.addEventListener('animationend', () => particle.remove());
            fragment.appendChild(particle);
        }
    }
    document.body.appendChild(fragment);
}

function tileCenter(tile) {
    const rect = tile.el.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

// (Re)start a one-shot .cube animation driven by a tile class, removing the
// class when it ends so it cannot keep overriding hint/hover transforms.
function playCubeAnim(el, cls, animName) {
    const cube = el.querySelector('.cube');
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    const done = e => {
        if (e.target !== cube || e.animationName !== animName) return;
        el.classList.remove(cls);
        cube.removeEventListener('animationend', done);
        cube.removeEventListener('animationcancel', done);
    };
    cube.addEventListener('animationend', done);
    cube.addEventListener('animationcancel', done);
}

// Beams from a line bomb out to both ends of its row/column, in screen space.
function fireBeams(bomb, delay) {
    const from = tileCenter(bomb);
    const ends = bomb.special === 'row'
        ? [tiles[key(bomb.r, 0)], tiles[key(bomb.r, COLS - 1)]]
        : [tiles[key(0, bomb.c)], tiles[key(ROWS - 1, bomb.c)]];
    const color = activeColors()[bomb.color] || '#fff';
    for (const end of ends) {
        if (!end || end === bomb) continue;
        const to = tileCenter(end);
        const cells = Math.abs(end.r - bomb.r) + Math.abs(end.c - bomb.c);
        const dx = to.x - from.x, dy = to.y - from.y;
        const len = Math.hypot(dx, dy) * (1 + 0.5 / cells); // overshoot half a cell
        const beam = document.createElement('div');
        beam.className = 'beam';
        beam.style.left = from.x + 'px';
        beam.style.top = from.y + 'px';
        beam.style.width = len + 'px';
        beam.style.setProperty('--angle', Math.atan2(dy, dx) + 'rad');
        beam.style.setProperty('--color', color);
        beam.style.animationDelay = delay + 'ms';
        beam.addEventListener('animationend', () => beam.remove());
        document.body.appendChild(beam);
    }
}

// Jagged lightning from a color bomb to every target tile; targets flicker
// as their bolt lands. Returns once the strike has played out.
async function strikeLightning(bomb, targetKeys, glowColor) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'lightning');
    svg.style.setProperty('--glow', glowColor);
    const from = tileCenter(bomb);
    const zapped = [];
    let i = 0;
    for (const k of targetKeys) {
        const t = tiles[k];
        if (!t || t === bomb) continue;
        const to = tileCenter(t);
        const dx = to.x - from.x, dy = to.y - from.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len, ny = dx / len;
        const points = [];
        for (let s = 0; s <= 6; s++) {
            const f = s / 6;
            const jitter = s === 0 || s === 6 ? 0 : (Math.random() - 0.5) * 22;
            points.push((from.x + dx * f + nx * jitter).toFixed(1) + ',' +
                        (from.y + dy * f + ny * jitter).toFixed(1));
        }
        const bolt = document.createElementNS(ns, 'polyline');
        bolt.setAttribute('points', points.join(' '));
        bolt.setAttribute('pathLength', '1');
        const delay = Math.min(i++ * 12, 240);
        bolt.style.animationDelay = delay + 'ms';
        t.el.style.setProperty('--zap-delay', delay + 150 + 'ms');
        t.el.classList.add('zapped');
        zapped.push(t);
        svg.appendChild(bolt);
    }
    svg.addEventListener('animationend', e => { if (e.target === svg) svg.remove(); });
    document.body.appendChild(svg);
    await wait(Math.min(Math.max(i - 1, 0) * 12, 240) + 500);
    for (const t of zapped) t.el.classList.remove('zapped');
}

const COMBO_WORDS = {
    classic:  ['Sweet!', 'Amazing!', 'Incredible!'],
    retro:    ['COMBO!', 'MEGA COMBO!', 'ULTRA COMBO!'],
    candy:    ['Sugar Rush!', 'Delicious!', 'Divine!'],
    starwars: ['Impressive!', 'Legendary!', 'Unlimited Power!'],
};

// Escalating feedback per cascade level: background flash from x2,
// board shake from x3, banner from x5.
function comboEffects(cascade) {
    if (cascade < 2) return;
    const flash = document.createElement('div');
    flash.className = 'combo-flash';
    flash.style.setProperty('--flash-strength', Math.min(0.3 + cascade * 0.12, 1));
    flash.addEventListener('animationend', () => flash.remove());
    document.body.appendChild(flash);

    if (cascade >= 3) {
        const scene = document.querySelector('.scene');
        scene.style.setProperty('--shake', Math.min(3 + (cascade - 3) * 2, 10) + 'px');
        scene.classList.remove('shake');
        void scene.offsetWidth;
        scene.classList.add('shake');
        scene.addEventListener('animationend', function done(e) {
            if (e.target !== scene) return;
            scene.classList.remove('shake');
            scene.removeEventListener('animationend', done);
        });
    }

    if (cascade >= 5) {
        const words = COMBO_WORDS[currentTheme()];
        const banner = document.createElement('div');
        banner.className = 'combo-banner';
        banner.textContent = words[Math.min(cascade - 5, words.length - 1)];
        banner.addEventListener('animationend', () => banner.remove());
        document.body.appendChild(banner);
    }
}

// ── board init ───────────────────────────────────────────
function createBoard() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            let col;
            do {
                col = Math.floor(Math.random() * COLORS.length);
            } while (
                (c >= 2 && grid[r][c-1] === col && grid[r][c-2] === col) ||
                (r >= 2 && grid[r-1][c] === col && grid[r-2][c] === col)
            );
            grid[r][c] = col;
        }
    }

    tiles = {};
    // remove old tile elements
    board.innerHTML = '';

    const tmpFrag = document.createDocumentFragment();
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            const el = makeTileEl(grid[r][c]);
            setTilePos(el, r, c);
            styleColor(el, grid[r][c]);
            // no transition on init
            el.style.transition = 'none';
            tiles[key(r,c)] = { el, r, c, color: grid[r][c], special: null };
        }
    }

    requestAnimationFrame(() => {
        for (const k in tiles) tiles[k].el.style.transition = '';
    });
}

// ── click-to-swap interaction ────────────────────────────
let selected = null;   // currently selected tile object
let autoMode = false;
let autoRunId = 0;

function getTileAtEl(target) {
    let el = target;
    while (el && el !== board) {
        if (el.classList && el.classList.contains('tile')) {
            for (const k in tiles) {
                if (tiles[k].el === el) return tiles[k];
            }
            return null;
        }
        el = el.parentElement;
    }
    return null;
}

board.addEventListener('click', onClick);

function onClick(e) {
    if (animating || autoMode) return;
    enableAudio();
    clearHint();
    const tile = getTileAtEl(e.target);
    if (!tile) {
        clearSelection();
        return;
    }
    if (!selected) {
        selectTile(tile);
        return;
    }
    if (selected === tile) {
        clearSelection();
        return;
    }
    const adjacent = Math.abs(selected.r - tile.r) + Math.abs(selected.c - tile.c) === 1;
    if (adjacent) {
        const s = selected;
        clearSelection();
        doSwap(s.r, s.c, tile.r, tile.c);
    } else {
        // switch selection to the newly clicked tile
        clearSelection();
        selectTile(tile);
    }
}

function selectTile(tile) {
    selected = tile;
    tile.el.classList.add('selected');
}

function clearSelection() {
    if (selected) selected.el.classList.remove('selected');
    selected = null;
}

// ── swap + match loop ───────────────────────────────────
// Rejected-swap feedback: both tiles nudge a third of a cell toward each
// other, then snap home and wobble. Grid and tiles stay untouched.
async function bumpTiles(t1, t2) {
    const dr = t2.r - t1.r, dc = t2.c - t1.c;
    const nudge = CELL * 0.35;
    for (const [t, dir] of [[t1, 1], [t2, -1]]) {
        t.el.classList.add('bumping');
        t.el.style.top = t.r * CELL + dr * nudge * dir + 'px';
        t.el.style.left = t.c * CELL + dc * nudge * dir + 'px';
    }
    await wait(130);
    playInvalidSound();
    for (const t of [t1, t2]) {
        setTilePos(t.el, t.r, t.c);
        playCubeAnim(t.el, 'wobble', 'wobble');
    }
    await wait(170);
    for (const t of [t1, t2]) t.el.classList.remove('bumping');
}

async function doSwap(r1, c1, r2, c2) {
    animating = true;

    // ensure we have the tile objects for current data positions
    const t1 = tiles[key(r1,c1)], t2 = tiles[key(r2,c2)];
    if (!t1 || !t2) { animating = false; return; }
    playSwapSound();

    // rejected swaps never change the grid: the tiles bump and wobble back
    const bombSwap = t1.special === 'color' || t2.special === 'color';
    if (!bombSwap && !swapWouldMatch(r1, c1, r2, c2)) {
        await bumpTiles(t1, t2);
        animating = false;
        return;
    }

    // swap colors in grid
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];

    // Each tile keeps its color and moves to that color's new grid position.
    setTilePos(t2.el, r1, c1);
    setTilePos(t1.el, r2, c2);

    tiles[key(r1,c1)] = t2;
    tiles[key(r2,c2)] = t1;

    // update internal r/c
    t1.r = r2; t1.c = c2;
    t2.r = r1; t2.c = c1;

    await wait(280);

    // swapping a color bomb is always valid: it clears every tile of the
    // other tile's color (or the whole board if both are color bombs)
    if (bombSwap) {
        const bombT = t1.special === 'color' ? t1 : t2;
        const otherT = bombT === t1 ? t2 : t1;
        const clearAll = otherT.special === 'color';
        const clearSet = new Set([key(bombT.r, bombT.c), key(otherT.r, otherT.c)]);
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (clearAll ? grid[r][c] >= 0 : grid[r][c] === otherT.color) {
                    clearSet.add(key(r, c));
                }
            }
        }
        moves++;
        document.getElementById('moves').textContent = moves;
        await strikeLightning(bombT, clearSet,
            clearAll ? '#fff' : activeColors()[otherT.color] || '#fff');
        await processMatches(clearSet);
        return;
    }

    moves++;
    document.getElementById('moves').textContent = moves;
    await processMatches(null, [[r1, c1], [r2, c2]]);
}

// initialClear: optional Set of keys to remove first (color bomb activation).
// swapTargets: the two cells the player just swapped into, so a special
// created by that swap spawns on the moved tile (else mid-run).
async function processMatches(initialClear = null, swapTargets = null) {
    let cascade = 0;
    let pending = initialClear;
    while (true) {
        const removalSet = new Set();
        const creations = []; // { r, c, type: 'row'|'col'|'color' }

        if (pending) {
            for (const k of pending) removalSet.add(k);
            pending = null;
        } else {
            const runs = findRuns();
            if (runs.length === 0) break;
            for (const run of runs) {
                for (const [r, c] of run.cells) removalSet.add(key(r, c));
                if (run.cells.length >= 4) {
                    let cell = null;
                    if (swapTargets) {
                        for (const st of swapTargets) {
                            if (run.cells.some(([r, c]) => r === st[0] && c === st[1])) { cell = st; break; }
                        }
                    }
                    if (!cell) cell = run.cells[Math.floor(run.cells.length / 2)];
                    if (!creations.some(cr => cr.r === cell[0] && cr.c === cell[1])) {
                        creations.push({ r: cell[0], c: cell[1],
                            type: run.cells.length >= 5 ? 'color' : (run.dir === 'h' ? 'row' : 'col') });
                    }
                }
            }
            swapTargets = null;
            // creation cells transform instead of being removed
            for (const cr of creations) removalSet.delete(key(cr.r, cr.c));
        }

        // blast closure: removed line bombs clear their row/column,
        // which may trigger further line bombs in turn. popDelay staggers
        // blasted tiles outward from their bomb (40ms per cell, chained).
        const triggered = new Set();
        const popDelay = new Map();
        const beams = [];
        let changed = true;
        while (changed) {
            changed = false;
            for (const k of [...removalSet]) {
                const t = tiles[k];
                if (!t || triggered.has(k)) continue;
                if (t.special !== 'row' && t.special !== 'col') continue;
                triggered.add(k);
                const d0 = popDelay.get(k) || 0;
                beams.push({ tile: t, delay: d0 });
                for (let i = 0; i < (t.special === 'row' ? COLS : ROWS); i++) {
                    const br = t.special === 'row' ? t.r : i;
                    const bc = t.special === 'row' ? i : t.c;
                    const bk = key(br, bc);
                    if (!removalSet.has(bk) && tiles[bk]) {
                        removalSet.add(bk);
                        const dist = t.special === 'row' ? Math.abs(i - t.c) : Math.abs(i - t.r);
                        popDelay.set(bk, Math.min(d0 + dist * 40, 480));
                        changed = true;
                    }
                }
            }
        }
        // a creation cell caught in a blast is removed, not transformed
        for (let i = creations.length - 1; i >= 0; i--) {
            if (removalSet.has(key(creations[i].r, creations[i].c))) creations.splice(i, 1);
        }

        if (removalSet.size === 0 && creations.length === 0) break;
        cascade++;

        // transform creation cells into specials (they stay on the board)
        for (const cr of creations) {
            const t = tiles[key(cr.r, cr.c)];
            t.special = cr.type;
            t.el.classList.toggle('special-row', cr.type === 'row');
            t.el.classList.toggle('special-col', cr.type === 'col');
            t.el.classList.toggle('special-color', cr.type === 'color');
            if (cr.type === 'color') { t.color = COLOR_BOMB; grid[cr.r][cr.c] = COLOR_BOMB; }
            styleColor(t.el, t.color, cr.type);
            playCubeAnim(t.el, 'special-pop', 'special-pop');
        }

        const pointsEarned = removalSet.size * 10 * cascade +
            creations.reduce((sum, cr) => sum + (cr.type === 'color' ? 150 : 50), 0);
        playMatchSound(removalSet.size);
        for (const b of beams) fireBeams(b.tile, b.delay);
        if (removalSet.size > 0) {
            burstParticles(removalSet, cascade, popDelay);
            showPoints(pointsEarned, removalSet, cascade);
        }
        comboEffects(cascade);
        score += pointsEarned;
        document.getElementById('score').textContent = score;

        // animate matching tiles out; blasted tiles start after their delay
        let maxDelay = 0;
        for (const k of removalSet) {
            const el = tiles[k].el;
            const d = popDelay.get(k) || 0;
            if (d > 0) {
                el.style.animationDelay = d + 'ms';
                for (const face of el.querySelectorAll('.face')) face.style.animationDelay = d + 'ms';
                maxDelay = Math.max(maxDelay, d);
            }
            el.classList.add('match-anim');
        }

        await wait(680 + maxDelay);

        // remove matched tile elements and grid entries
        for (const k of removalSet) {
            const [r, c] = k.split(',').map(Number);
            tiles[k].el.remove();
            delete tiles[k];
            grid[r][c] = -1;
        }

        await wait(50);

        // gravity
        const drops  = []; // { oldK, newR } tile that still exists and drops down
        const spawns = []; // { row, col, color, fromRow } brand-new tile

        for (let c = 0; c < COLS; c++) {
            let writeIdx = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (grid[r][c] !== -1) {
                    if (writeIdx !== r) {
                        grid[writeIdx][c] = grid[r][c];
                        const kOld = key(r,c);
                        drops.push({ el: tiles[kOld].el, color: tiles[kOld].color,
                                     special: tiles[kOld].special, newR: writeIdx, col: c });
                        delete tiles[kOld];
                        grid[r][c] = -1;
                    }
                    writeIdx--;
                }
            }

            const numEmpty = writeIdx + 1;
            for (let i = 0; i < numEmpty; i++) {
                if (i < ROWS) {
                    const colVal = Math.floor(Math.random() * COLORS.length);
                    grid[i][c] = colVal;
                    spawns.push({ row: i, col: c, color: colVal, fromRow: -numEmpty + i });
                }
            }
        }

        // animate existing tiles dropping: ease-in fall, staggered per
        // column, then a squash on landing
        const FALL_STAGGER = 16;
        const fallen = [];
        for (const d of drops) {
            const el = d.el;
            el.style.setProperty('--fall-delay', d.col * FALL_STAGGER + 'ms');
            el.classList.add('falling');
            el.classList.remove('spawned');
            playCubeAnim(el, 'landing', 'land');
            setTilePos(el, d.newR, d.col);
            fallen.push(el);
            tiles[key(d.newR, d.col)] = { el, r: d.newR, c: d.col, color: d.color, special: d.special };
        }

        // create and animate spawn tiles: they also drop in from above
        // the board plane with a spin (spawn-land keyframes)
        for (const sp of spawns) {
            const el = makeTileEl(sp.color);
            styleColor(el, sp.color);
            el.style.transition = 'none';
            el.style.setProperty('--fall-delay', sp.col * FALL_STAGGER + 'ms');
            el.classList.add('spawned');
            playCubeAnim(el, 'landing', 'spawn-land');
            setTilePos(el, sp.fromRow, sp.col);
            board.appendChild(el);

            requestAnimationFrame(() => {
                el.style.transition = '';
                el.classList.add('falling');
                setTilePos(el, sp.row, sp.col);
            });
            fallen.push(el);

            tiles[key(sp.row, sp.col)] = { el, r: sp.row, c: sp.col, color: sp.color, special: null };
        }

        await wait(300 + (COLS - 1) * FALL_STAGGER + 30);
        for (const el of fallen) el.classList.remove('falling');
    }
    animating = false;
}

// ── find matches ────────────────────────────────────────
// findRuns returns maximal runs of 3+ as { cells: [[r,c]...], dir: 'h'|'v' }.
// Color bombs (grid value COLOR_BOMB) never form runs.
function findRuns(values = grid) {
    const runs = [];
    for (let r = 0; r < ROWS; r++) {
        let c = 0;
        while (c <= COLS - 3) {
            const v = values[r][c];
            if (v >= 0 && v < COLORS.length && v === values[r][c+1] && v === values[r][c+2]) {
                const cells = [[r,c],[r,c+1],[r,c+2]];
                let e = c + 3;
                while (e < COLS && values[r][e] === v) { cells.push([r,e]); e++; }
                runs.push({ cells, dir: 'h' });
                c = e;
            } else c++;
        }
    }
    for (let c = 0; c < COLS; c++) {
        let r = 0;
        while (r <= ROWS - 3) {
            const v = values[r][c];
            if (v >= 0 && v < COLORS.length && v === values[r+1][c] && v === values[r+2][c]) {
                const cells = [[r,c],[r+1,c],[r+2,c]];
                let e = r + 3;
                while (e < ROWS && values[e][c] === v) { cells.push([e,c]); e++; }
                runs.push({ cells, dir: 'v' });
                r = e;
            } else r++;
        }
    }
    return runs;
}

// flat list of matched cells (used by hints and the swap validity check)
function findMatches() {
    const matched = new Set();
    for (const run of findRuns()) {
        for (const [r, c] of run.cells) matched.add(key(r,c));
    }
    return [...matched].map(s => s.split(',').map(Number));
}

// ── ambient wave animation ───────────────────────────────
// Tiles bob along a diagonal (r + c) wave. Phase is computed from each
// tile's live r/c so the wave stays coherent after swaps and gravity.
// The inline translateZ is overridden by the .match-anim rise keyframes
// on matched tiles, so removal animation is unaffected.
let waveOn = false;
let waveRafId = null;

function waveTick(now) {
    for (const k in tiles) {
        const t = tiles[k];
        const z = 14 * Math.sin(now / 450 - (t.r + t.c) * 0.55);
        t.el.style.transform = 'translateZ(' + z.toFixed(2) + 'px)';
    }
    waveRafId = waveOn ? requestAnimationFrame(waveTick) : null;
}

document.getElementById('wave-btn').addEventListener('click', () => {
    waveOn = !waveOn;
    const btn = document.getElementById('wave-btn');
    btn.textContent = 'Wave: ' + (waveOn ? 'On' : 'Off');
    btn.classList.toggle('active', waveOn);
    if (waveOn) {
        waveRafId = requestAnimationFrame(waveTick);
    } else {
        cancelAnimationFrame(waveRafId);
        for (const k in tiles) tiles[k].el.style.transform = '';
    }
});

// ── camera views ─────────────────────────────────────────
// iso is the default .board transform; view-top/view-front classes
// override it and the .8s transform transition animates the switch.
const VIEWS = ['iso', 'top', 'front'];
let viewIdx = 0;

function setView(name) {
    board.classList.toggle('view-top', name === 'top');
    board.classList.toggle('view-front', name === 'front');
    document.getElementById('cam-btn').textContent =
        'Camera: ' + name[0].toUpperCase() + name.slice(1);
}

document.getElementById('cam-btn').addEventListener('click', () => {
    viewIdx = (viewIdx + 1) % VIEWS.length;
    setView(VIEWS[viewIdx]);
});

// ── hint ─────────────────────────────────────────────────
// findHint test-swaps every adjacent pair in the grid (reverting
// after each check) and returns a random pair whose swap would
// create a match. The two tiles pulse gold via the .hint class
// until the player's next board click clears them.
let hintTiles = [];

function clearHint() {
    for (const t of hintTiles) t.el.classList.remove('hint');
    hintTiles = [];
}

function swapWouldMatch(r1, c1, r2, c2) {
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    const ok = findMatches().length > 0;
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    return ok;
}

function getValidMoves() {
    const candidates = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            for (const [dr, dc] of [[0, 1], [1, 0]]) {
                const r2 = r + dr, c2 = c + dc;
                if (r2 >= ROWS || c2 >= COLS) continue;
                const s1 = tiles[key(r, c)], s2 = tiles[key(r2, c2)];
                if ((s1 && s1.special === 'color') || (s2 && s2.special === 'color')) {
                    candidates.push([[r, c], [r2, c2]]); // color bomb swaps always work
                    continue;
                }
                if (grid[r][c] === grid[r2][c2]) continue; // no-op swap
                if (swapWouldMatch(r, c, r2, c2)) candidates.push([[r, c], [r2, c2]]);
            }
        }
    }
    return candidates;
}

function findHint() {
    const candidates = getValidMoves();
    return candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : null;
}

function expandLineBlasts(removalSet, specialAt) {
    const triggered = new Set();
    let changed = true;
    while (changed) {
        changed = false;
        for (const k of [...removalSet]) {
            if (triggered.has(k)) continue;
            const [r, c] = k.split(',').map(Number);
            const special = specialAt(r, c);
            if (special !== 'row' && special !== 'col') continue;
            triggered.add(k);
            for (let i = 0; i < (special === 'row' ? COLS : ROWS); i++) {
                const br = special === 'row' ? r : i;
                const bc = special === 'row' ? i : c;
                const blastKey = key(br, bc);
                if (!removalSet.has(blastKey) && tiles[blastKey]) {
                    removalSet.add(blastKey);
                    changed = true;
                }
            }
        }
    }
}

function collapseValues(values) {
    for (let c = 0; c < COLS; c++) {
        let write = ROWS - 1;
        for (let r = ROWS - 1; r >= 0; r--) {
            if (values[r][c] >= 0) {
                values[write][c] = values[r][c];
                write--;
            }
        }
        for (let r = 0; r <= write; r++) values[r][c] = -1;
    }
}

function estimateCascadePotential(removalSet, creations) {
    const values = grid.map(row => row.slice());
    for (const cr of creations) {
        if (cr.type === 'color') values[cr.r][cr.c] = COLOR_BOMB;
    }
    for (const k of removalSet) {
        const [r, c] = k.split(',').map(Number);
        values[r][c] = -1;
    }

    let potential = 0;
    for (let depth = 0; depth < 2; depth++) {
        collapseValues(values);
        const runs = findRuns(values);
        if (runs.length === 0) break;
        const cells = new Set();
        for (const run of runs) {
            for (const [r, c] of run.cells) cells.add(key(r, c));
            if (run.cells.length >= 4) potential += run.cells.length >= 5 ? 300 : 120;
        }
        potential += cells.size * 70 + runs.length * 220;
        for (const k of cells) {
            const [r, c] = k.split(',').map(Number);
            values[r][c] = -1;
        }
    }
    return potential;
}

function scoreAutoMove(move) {
    const [[r1, c1], [r2, c2]] = move;
    const t1 = tiles[key(r1, c1)], t2 = tiles[key(r2, c2)];
    const specialAtSwap = (r, c) => {
        if (r === r1 && c === c1) return t2.special;
        if (r === r2 && c === c2) return t1.special;
        const tile = tiles[key(r, c)];
        return tile ? tile.special : null;
    };

    if (t1.special === 'color' || t2.special === 'color') {
        const bomb = t1.special === 'color' ? t1 : t2;
        const other = bomb === t1 ? t2 : t1;
        const clearAll = other.special === 'color';
        const removalSet = new Set([key(r1, c1), key(r2, c2)]);
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (clearAll ? grid[r][c] >= 0 : grid[r][c] === other.color) {
                    removalSet.add(key(r, c));
                }
            }
        }
        expandLineBlasts(removalSet, specialAtSwap);
        return removalSet.size * 10 + removalSet.size * removalSet.size;
    }

    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    const runs = findRuns();
    const matched = new Set();
    const creations = [];
    let longestRun = 0;
    for (const run of runs) {
        longestRun = Math.max(longestRun, run.cells.length);
        for (const [r, c] of run.cells) matched.add(key(r, c));
        if (run.cells.length >= 4) {
            let cell = null;
            for (const target of move) {
                if (run.cells.some(([r, c]) => r === target[0] && c === target[1])) {
                    cell = target;
                    break;
                }
            }
            if (!cell) cell = run.cells[Math.floor(run.cells.length / 2)];
            if (!creations.some(cr => cr.r === cell[0] && cr.c === cell[1])) {
                creations.push({
                    r: cell[0], c: cell[1],
                    type: run.cells.length >= 5 ? 'color' : (run.dir === 'h' ? 'row' : 'col')
                });
            }
        }
    }

    const removalSet = new Set(matched);
    for (const cr of creations) removalSet.delete(key(cr.r, cr.c));
    const specialAtMove = (r, c) => {
        for (const cr of creations) {
            if (cr.r === r && cr.c === c) return cr.type;
        }
        return specialAtSwap(r, c);
    };
    expandLineBlasts(removalSet, specialAtMove);
    for (let i = creations.length - 1; i >= 0; i--) {
        if (removalSet.has(key(creations[i].r, creations[i].c))) creations.splice(i, 1);
    }

    let score = removalSet.size * 10;
    score += creations.reduce((sum, cr) => sum + (cr.type === 'color' ? 150 : 50), 0);
    score += Math.max(0, runs.length - 1) * 140;
    score += Math.max(0, longestRun - 3) * 45;
    score += estimateCascadePotential(removalSet, creations);
    [grid[r1][c1], grid[r2][c2]] = [grid[r2][c2], grid[r1][c1]];
    return score;
}

function findBestHint() {
    const candidates = getValidMoves();
    if (candidates.length === 0) return null;
    let bestScore = -Infinity;
    let bestMoves = [];
    for (const candidate of candidates) {
        const score = scoreAutoMove(candidate);
        if (score > bestScore) {
            bestScore = score;
            bestMoves = [candidate];
        } else if (score === bestScore) {
            bestMoves.push(candidate);
        }
    }
    return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

// Auto mode ranks valid moves for points and cascade potential, then plays
// one move at a time so gravity and cascades finish before the next search.
const modeBtn = document.getElementById('mode-btn');

function setAutoMode(enabled) {
    autoMode = enabled;
    const runId = ++autoRunId;
    clearSelection();
    clearHint();
    modeBtn.textContent = 'Mode: ' + (enabled ? 'Auto' : 'Manual');
    modeBtn.classList.toggle('active', enabled);
    if (enabled) {
        enableAudio();
        autoPlayLoop(runId);
    }
}

async function autoPlayLoop(runId) {
    while (autoMode && runId === autoRunId) {
        if (animating) {
            await wait(50);
            continue;
        }

        const hint = findBestHint();
        if (!hint) {
            setAutoMode(false);
            break;
        }

        const [[r1, c1], [r2, c2]] = hint;
        const firstTile = tiles[key(r1, c1)];
        if (!firstTile) continue;
        selectTile(firstTile);
        await wait(220);
        if (!autoMode || runId !== autoRunId) break;
        clearSelection();
        await doSwap(r1, c1, r2, c2);
        await wait(120);
    }
    if (runId === autoRunId) clearSelection();
}

modeBtn.addEventListener('click', () => setAutoMode(!autoMode));

const soundBtn = document.getElementById('sound-btn');
soundBtn.addEventListener('click', () => {
    soundOn = !soundOn;
    soundBtn.textContent = 'Sound: ' + (soundOn ? 'On' : 'Off');
    soundBtn.classList.toggle('active', soundOn);
    if (soundOn) {
        enableAudio();
    } else if (audioCtx && audioCtx.state === 'running') {
        audioCtx.suspend();
    }
});

document.getElementById('hint-btn').addEventListener('click', () => {
    if (animating) return;
    clearHint();
    const hint = findHint();
    if (!hint) {
        const btn = document.getElementById('hint-btn');
        btn.textContent = 'No moves!';
        setTimeout(() => { btn.textContent = 'Hint'; }, 1000);
        return;
    }
    hintTiles = hint.map(([r, c]) => tiles[key(r, c)]);
    for (const t of hintTiles) t.el.classList.add('hint');
});

// ── projection toggle ────────────────────────────────────
// .scene.ortho raises perspective 1800px -> 40000px (~orthographic,
// i.e. an isometric camera); the .8s perspective transition animates it.
document.getElementById('proj-btn').addEventListener('click', () => {
    const ortho = document.querySelector('.scene').classList.toggle('ortho');
    document.getElementById('proj-btn').textContent = 'Proj: ' + (ortho ? 'Iso' : 'Persp');
});

// ── spin toggle ──────────────────────────────────────────
// Spins the scene container clockwise in screen space so the whole
// 3D board rotates regardless of the selected camera view.
document.getElementById('spin-btn').addEventListener('click', () => {
    const spinning = !board.classList.contains('spinning');
    const btn = document.getElementById('spin-btn');
    if (spinning) {
        const angle = getComputedStyle(board).getPropertyValue('--spin-angle').trim() || '0deg';
        board.style.setProperty('--spin-start', angle);
        board.classList.add('spinning');
    } else {
        const angle = getComputedStyle(board).getPropertyValue('--spin-angle').trim() || '0deg';
        board.style.setProperty('transition', 'none');
        board.classList.remove('spinning');
        board.style.setProperty('--spin-angle', angle);
        void board.offsetWidth;
        board.style.removeProperty('transition');
    }
    btn.textContent = 'Spin: ' + (spinning ? 'On' : 'Off');
    btn.classList.toggle('active', spinning);
});

// allow deep-linking a view: match3.html#top or #front
const hashView = location.hash.slice(1);
if (VIEWS.includes(hashView)) {
    viewIdx = VIEWS.indexOf(hashView);
    setView(hashView);
}

// Scale the camera on small screens so the rotated board stays inside the viewport.
function fitBoardToViewport() {
    const widthScale = (window.innerWidth - 24) / 720;
    const heightScale = (window.innerHeight - 230) / 520;
    const scale = Math.max(0.35, Math.min(1, widthScale, heightScale));
    board.style.setProperty('--board-scale', scale.toFixed(3));
}

window.addEventListener('resize', fitBoardToViewport);
fitBoardToViewport();

// ── theme toggle ─────────────────────────────────────────
// Cycles body between four looks — classic, neon CRT retro, cute candy,
// and a galactic Star Wars-inspired theme.
const themeBtn = document.getElementById('theme-btn');
const THEMES = ['classic', 'retro', 'candy', 'starwars'];

function applyTheme(name) {
    document.body.classList.remove('retro', 'candy', 'starwars');
    if (name === 'retro') document.body.classList.add('retro');
    else if (name === 'candy') document.body.classList.add('candy');
    else if (name === 'starwars') document.body.classList.add('starwars');
    themeBtn.textContent = 'Theme: ' + name.charAt(0).toUpperCase() + name.slice(1);
    try { localStorage.setItem('m3-theme', name); } catch (e) {}
    // candy uses a different tile palette, so re-style every tile
    for (const k in tiles) styleColor(tiles[k].el, tiles[k].color, tiles[k].special);
}

function currentTheme() {
    return document.body.classList.contains('retro') ? 'retro'
         : document.body.classList.contains('candy') ? 'candy'
         : document.body.classList.contains('starwars') ? 'starwars' : 'classic';
}

themeBtn.addEventListener('click', () => {
    applyTheme(THEMES[(THEMES.indexOf(currentTheme()) + 1) % THEMES.length]);
});

let savedTheme = 'classic';
try { savedTheme = localStorage.getItem('m3-theme') || 'classic'; } catch (e) {}
if (!THEMES.includes(savedTheme)) savedTheme = 'classic';

// go!
createBoard();
applyTheme(savedTheme);
</script>
</body>
